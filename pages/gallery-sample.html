    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .slider-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: auto;
            overflow: hidden;
            border-radius: 10px;
        }

        .slider {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Navigation Buttons */
        .prev,
        .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 20px;
            border-radius: 50%;
            z-index: 10;
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }

        .prev:hover,
        .next:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        /* Dots Navigation */
        .dots {
            text-align: center;
            padding: 10px;
        }

        .dot {
            height: 10px;
            width: 10px;
            margin: 5px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
            transition: background 0.3s;
        }

        .dot.active {
            background-color: #333;
        }

        /* Responsive */
        @media (max-width: 768px) {

            .prev,
            .next {
                padding: 5px;
                font-size: 16px;
            }
        }
    </style>
</head>

    <script>
        const slider = document.querySelector(".slider");
        const slides = document.querySelectorAll(".slide");
        const prevBtn = document.querySelector(".prev");
        const nextBtn = document.querySelector(".next");
        const dotsContainer = document.querySelector(".dots");

        let index = 0;
        let autoSlideInterval;

        // Create dots dynamically
        slides.forEach((_, i) => {
            const dot = document.createElement("span");
            dot.classList.add("dot");
            dot.dataset.index = i;
            dotsContainer.appendChild(dot);
        });

        const dots = document.querySelectorAll(".dot");
        dots[index].classList.add("active");

        function updateSlider() {
            slider.style.transform = `translateX(-${index * 100}%)`;
            dots.forEach(dot => dot.classList.remove("active"));
            dots[index].classList.add("active");
        }

        function nextSlide() {
            index = (index + 1) % slides.length;
            updateSlider();
        }

        function prevSlide() {
            index = (index - 1 + slides.length) % slides.length;
            updateSlider();
        }

        // Autoplay
        function startAutoSlide() {
            autoSlideInterval = setInterval(nextSlide, 3000);
        }

        function stopAutoSlide() {
            clearInterval(autoSlideInterval);
        }

        // Swipe Gesture Support
        let startX = 0;
        slider.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; });
        slider.addEventListener("touchend", (e) => {
            let endX = e.changedTouches[0].clientX;
            if (startX - endX > 50) nextSlide();
            if (endX - startX > 50) prevSlide();
        });

        // Event Listeners
        nextBtn.addEventListener("click", () => { stopAutoSlide(); nextSlide(); startAutoSlide(); });
        prevBtn.addEventListener("click", () => { stopAutoSlide(); prevSlide(); startAutoSlide(); });

        dots.forEach(dot => {
            dot.addEventListener("click", (e) => {
                index = parseInt(e.target.dataset.index);
                updateSlider();
                stopAutoSlide();
                startAutoSlide();
            });
        });

        // Start the slider
        updateSlider();
        startAutoSlide();
    </script>

            opacity: 1;
        }
    </style>

    <script data-lazy-loader="1">
        (function () {
            const SEL = "img.lazy[data-src]";
            function loadNow(img) {
                img.src = img.dataset.src;
                img.onload = function () { img.classList.add("loaded"); };
                img.removeAttribute("data-src");
            }
            if (!("IntersectionObserver" in window)) {
                document.querySelectorAll(SEL).forEach(loadNow);
                return;
            }
            const io = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (!entry.isIntersecting) return;
                    loadNow(entry.target);
                    io.unobserve(entry.target);
                });
            }, { rootMargin: "250px 0px" });
            document.querySelectorAll(SEL).forEach(function (img) { io.observe(img); });
        })();
    </script>
